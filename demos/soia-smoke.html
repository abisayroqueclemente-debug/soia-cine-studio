<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SOIA CINE STUDIO — primera prueba</title>
  <style>html,body{margin:0;background:#080b16;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="film"></canvas>
<script>
"use strict";
// Primera prueba propia. Animacion determinista, sin APIs ni recursos externos.
const query = new URLSearchParams(location.search);
const width = Math.min(1920, Math.max(160, Number(query.get("w")) || 640));
const height = Math.min(1080, Math.max(90, Number(query.get("h")) || 360));
const fps = 24;
const duration = 3;
const frames = duration * fps;
const canvas = document.getElementById("film");
canvas.width = width;
canvas.height = height;
const ctx = canvas.getContext("2d", {alpha:false});
const clamp = (x,lo=0,hi=1)=>Math.max(lo,Math.min(hi,x));
const ease = x => {const v=clamp(x);return v*v*(3-2*v);};
function draw(i) {
  const t = Math.min(frames-1, Math.max(0, i))/fps;
  const w = width, h = height, s = Math.min(w/640,h/360);
  ctx.clearRect(0,0,w,h);
  const bg = ctx.createLinearGradient(0,0,w,h);
  bg.addColorStop(0,"#070b16");
  bg.addColorStop(0.6,"#141a35");
  bg.addColorStop(1,"#080c18");
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.translate(w/2,h/2);
  const pulse=1+0.055*Math.sin(t*7);
  const glow=ctx.createRadialGradient(0,0,10*s,0,0,180*s);
  glow.addColorStop(0,"rgba(242,174,84,.23)");
  glow.addColorStop(1,"rgba(242,174,84,0)");
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,180*s,0,Math.PI*2);ctx.fill();
  const entry=ease(t/0.8);
  for(let n=0;n<3;n++){
    const radius=(62+n*20)*s*pulse;
    const alpha=(0.47-n*.11)*entry;
    ctx.strokeStyle=`rgba(238,176,94,${alpha})`;
    ctx.lineWidth=(n===0?2.7:1.1)*s;
    ctx.beginPath();ctx.arc(0,0,radius,t*.21+n*.18,t*.21+Math.PI*1.4+n*.18);ctx.stroke();
  }
  // A small central mark, fully controlled by the timeline.
  ctx.rotate(t*.10);
  ctx.fillStyle="#e9aa5b";
  ctx.globalAlpha=entry;
  ctx.fillRect(-9*s,-23*s,5*s,46*s);
  ctx.fillRect(4*s,-23*s,5*s,46*s);
  ctx.fillRect(-3*s,-4*s,6*s,8*s);
  ctx.restore();
  const rise=ease((t-.45)/.7), fade=ease((duration-t)/.5);
  ctx.globalAlpha=rise*fade;
  ctx.fillStyle="#f4e8d6";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font=`700 ${Math.round(32*s)}px system-ui, Arial, sans-serif`;
  ctx.fillText("SOIA CINE STUDIO", w/2, h/2+123*s);
  ctx.globalAlpha=.8*ease((t-1)/.7)*fade;
  ctx.font=`${Math.round(11*s)}px system-ui, Arial, sans-serif`;
  ctx.fillStyle="#dec49a";
  ctx.fillText("PRIMER RENDER · PRODUCCIÓN CON CÓDIGO",w/2,h/2+151*s);
  ctx.globalAlpha=1;
  // Motion never depends on wall-clock time.
  const line=ease(t/duration);
  ctx.fillStyle="#be8350";ctx.fillRect(0,h-3*s,w*line,3*s);
}
window.READY=Promise.resolve({frames,fps,width,height,renderer:"canvas2d"});
window.captureFrame=(i,mime="image/png",quality=.95)=>{
  draw(i);
  return canvas.toDataURL(mime,quality);
};
draw(0);
</script>
</body>
</html>
